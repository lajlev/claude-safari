name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 1.0.1)"
        required: true
      publish:
        description: "Create a GitHub Release and tag v<version> on this commit"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Pinned Xcode on the macos-26 image. The runner-images README lists what is installed.
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not of the form X.Y.Z"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          [[ -n "$P12" ]] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [[ -n "$P12_PASSWORD" ]] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -n "$TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          if [[ -n "$ASC_KEY" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" ]]; then
            echo "Notarization: App Store Connect API key"
          elif [[ -n "$APPLE_ID" && -n "$APPLE_PW" ]]; then
            echo "Notarization: Apple ID + app-specific password"
          else
            missing+=("APPSTORE_CONNECT_API_KEY_P8_BASE64 + APPSTORE_CONNECT_API_KEY_ID + APPSTORE_CONNECT_ISSUER_ID (or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD)")
          fi
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. Releases must be signed and notarized; see docs/RELEASING.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "::warning::$XCODE_APP not found, falling back to /Applications/Xcode.app"
            XCODE_APP=/Applications/Xcode.app
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --find safari-web-extension-converter

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT="$RUNNER_TEMP/cert.p12"
          printf '%s' "$P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # Apple's Developer ID intermediate, so the identity validates even if the .p12 lacks the chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put the temp keychain first on the user search list, keep the existing ones.
          existing=()
          while IFS= read -r k; do
            k="${k//\"/}"; k="${k#"${k%%[![:space:]]*}"}"
            [[ -n "$k" ]] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"Developer ID Application' || {
            echo "::error::The .p12 does not contain a valid 'Developer ID Application' identity (certificate plus private key)."
            exit 1
          }

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          if [[ -n "$ASC_KEY" ]]; then
            KEY="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$ASC_KEY" | base64 --decode > "$KEY"
            chmod 600 "$KEY"
            echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize and package
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/release.sh "$VERSION"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Send-to-Claude-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.sha256 }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
          SHA: ${{ steps.build.outputs.sha256 }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Send to Claude $TAG" --generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")  # creates the tag on this commit
          fi
          gh release create "$TAG" "$ZIP" "$SHA" "${args[@]}"

      - name: Clean up keychain and keys
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
